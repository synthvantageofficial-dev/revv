<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revv — Create account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/cert.css">
<style>
  body{display:grid;place-items:center;min-height:100vh}
  .login{width:100%;max-width:380px;padding:22px}
  .login .brand{justify-content:center;font-size:26px;margin-bottom:6px}
  .login .welcome{text-align:center;color:var(--muted);font-size:14px;margin-bottom:22px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  .field input{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;outline:none;box-sizing:border-box}
  .field input:focus{border-color:var(--brand)}
  .login .btn{width:100%;justify-content:center;margin-top:4px}
  .err{color:var(--danger);font-size:13.5px;margin-top:12px;text-align:center;display:none}
  .err.show{display:block}
  .divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--muted);font-size:12px}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line)}
  .g-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;transition:border-color .15s,background .15s;text-decoration:none;box-sizing:border-box}
  .g-btn:hover{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 5%,transparent)}
  .g-btn svg{flex-shrink:0}
  .link{margin-top:18px;font-size:13px;text-align:center}
  .link a{color:var(--brand);font-weight:600;text-decoration:none}
</style>
</head>
<body>
  <div class="card login">
    <div class="brand"><span class="spark" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M13 2L4.5 13.2a.8.8 0 0 0 .64 1.28H10l-1 7.5 8.5-11.2a.8.8 0 0 0-.64-1.28H12l1-7.5Z" fill="currentColor"/></svg></span> Revv</div>
    <div class="welcome">Create your operator account</div>

    <a class="g-btn" href="/auth/google" id="gbtn">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59a14.5 14.5 0 0 1 0-9.18l-7.98-6.19a24.0 24.0 0 0 0 0 21.56l7.98-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Sign up with Google
    </a>

    <div class="divider">or</div>

    <form id="form">
      <div class="field"><label for="name">Full name</label><input id="name" autocomplete="name" autofocus required></div>
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="new-password" minlength="6" required></div>
      <button class="btn" type="submit" id="submit">Create account</button>
      <div class="err" id="err"></div>
    </form>

    <div class="link">Already have an account? <a href="/login">Sign in</a></div>
  </div>
<script>
const $=s=>document.querySelector(s);
$("#form").addEventListener("submit", async(e)=>{
  e.preventDefault();
  const err=$("#err"); err.classList.remove("show");
  const btn=$("#submit"); btn.disabled=true; btn.textContent="Creating account…";
  try{
    const res=await fetch("/api/signup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:$("#name").value,email:$("#email").value,password:$("#pw").value})});
    const d=await res.json();
    if(d.ok){ location.href="/"; }
    else { err.textContent=d.error; err.classList.add("show"); btn.disabled=false; btn.textContent="Create account"; }
  }catch(ex){ err.textContent="Something went wrong. Try again."; err.classList.add("show"); btn.disabled=false; btn.textContent="Create account"; }
});
</script>
</body>
</html>
